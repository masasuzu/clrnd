# GoReleaser configuration. Docs: https://goreleaser.com
version: 2

project_name: clrnd

before:
  hooks:
    # tidy rewrites go.mod/go.sum in the middle of a release and re-resolves the module
    # graph. There would be no guarantee that the dependencies CI verified match those of
    # the released binary, so only download.
    - go mod download

builds:
  - id: clrnd
    main: .
    binary: clrnd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      # Do not embed absolute paths in the binary (reproducibility).
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/masasuzu/clrnd/cmd.version={{ .Version }}
    # Use the commit time rather than the build time (reproducibility).
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    # Windows is more commonly distributed as zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# Sign checksums.txt keylessly. Checksums served from the same place as the artifacts
# guarantee nothing on their own once the distribution point is compromised.
#
# cosign v3 defaults to the new bundle format (--new-bundle-format=true), and
# --output-signature / --output-certificate are ignored with a warning.
# Without --bundle it then tries to write to an empty path and fails:
#   Error: signing dist/checksums.txt: create bundle file: open : no such file or directory
# The signature and certificate go out together in a single .bundle. README explains how to
# verify it.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
