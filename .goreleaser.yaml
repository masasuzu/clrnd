# GoReleaser configuration. Docs: https://goreleaser.com
version: 2

project_name: clrnd

before:
  hooks:
    # tidy はリリースの最中に go.mod/go.sum を書き換え、モジュールグラフを
    # 引き直す。CI が検証した依存の集合とリリースされたバイナリの依存が
    # 一致する保証が無くなるので、取得だけにする。
    - go mod download

builds:
  - id: clrnd
    main: .
    binary: clrnd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      # 絶対パスをバイナリに埋め込まない (再現性)。
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/masasuzu/clrnd/cmd.version={{ .Version }}
    # ビルド時刻ではなくコミット時刻を使う (再現性)。
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    # Windows is more commonly distributed as zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# checksums.txt に keyless で署名する。成果物と同じ場所から配られる
# チェックサムだけでは、配布元が乗っ取られたときに何の保証にもならない。
#
# cosign v3 は新しい bundle 形式が既定 (--new-bundle-format=true) で、
# --output-signature / --output-certificate は警告を出したうえで無視される。
# その状態で --bundle を渡さないと空パスへ書こうとして落ちる:
#   Error: signing dist/checksums.txt: create bundle file: open : no such file or directory
# 署名と証明書は 1 つの .bundle にまとめて出す。検証方法は README にある。
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
