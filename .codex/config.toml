#:schema https://developers.openai.com/codex/config-schema.json

# Keep CLAUDE.md as the single source of repository guidance for both agents.
# Codex checks this fallback only when AGENTS.md is absent.
project_doc_fallback_filenames = ["CLAUDE.md"]

# CLAUDE.md is already close to Codex's 32 KiB default instruction limit.
project_doc_max_bytes = 65536
