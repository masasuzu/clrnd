name: release

on:
  push:
    tags:
      - "v*"

# タグを続けて push してもリリースジョブが競合しないようにする。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # タグ push では通常 CI (ci.yml の push.branches: [main]) が起動しないので、
  # ここで同じ検査を呼ぶ。これが無いと、テストが落ちるコミットや main に入って
  # いないコミットに付けたタグからでも、署名と provenance の付いた正式なリリースが
  # 公開できてしまう。署名は「そのコミットからビルドした」ことしか保証しない。
  # 呼び出し先の checkout はこのワークフローと同じ ref (タグ) を見るので、
  # 検査した SHA と GoReleaser がビルドする SHA は一致する。
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write      # リリースの作成と成果物のアップロード
      id-token: write      # cosign の keyless 署名と provenance
      attestations: write  # provenance の登録
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser は GITHUB_TOKEN の環境変数で認証するので、
          # git の認証情報を .git/config に残す必要はない。
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # cosign 本体のバージョンも固定する。アクションを SHA で固定していても、
      # 既定で入る cosign が上がると挙動が変わる (v3 で bundle 形式が既定になり、
      # v0.3.0 の初回リリースが署名で落ちた)。
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # アクションは SHA で固定しているのに GoReleaser 本体が浮動だと、
          # 挙動が変わってもビルドは黙って通る。正確なバージョンに固定する。
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
