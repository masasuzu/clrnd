name: release

on:
  push:
    tags:
      - "v*"

# Always run one release at a time. Including the tag (github.ref) in the group makes a separate
# group per tag, so pushing v1.2.3 and v1.2.4 back to back runs GoReleaser concurrently (both
# touching the same repository's release list and dist/). A fixed value serializes them.
# An earlier release is not cancelled: stopping it midway leaves only some artifacts published.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # Official releases are cut only from commits in main's history. Even for a commit that passes
  # the checks, this stops a tag on a branch that never reached main from publishing a release
  # with signatures, an SBOM and provenance. It runs before the checks (verify) so that a tag
  # that does not qualify does not spend minutes building.
  guard:
    runs-on: ubuntu-latest
    # Without a limit, a single hung job holds the runner for the default 6 hours.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is on main
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # checkout only fetches the tag's ref, so fetch main, the comparison target, explicitly.
          # The repository is public, so this needs no credentials (persist-credentials stays false).
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tag $TAG ($SHA) is not an ancestor of main; releases are cut from main only"
            exit 1
          fi
          echo "$TAG ($SHA) is on main"

  # A tag push does not trigger regular CI (ci.yml's push.branches: [main]), so the same
  # checks are called here. Without this, even a tag on a commit whose tests fail could publish
  # an official release carrying signatures and provenance (a commit that is not in main is
  # stopped earlier, by guard). A signature only guarantees "this was built from that commit".
  # The called workflow's checkout sees the same ref (the tag) as this workflow, so the
  # SHA that was checked and the SHA GoReleaser builds are the same.
  verify:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # create the release and upload the artifacts
      id-token: write      # keyless signing for cosign and packslip, provenance
      attestations: write  # register the provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser authenticates through the GITHUB_TOKEN environment variable,
          # so there is no need to leave git credentials in .git/config.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pin the version of cosign itself too. Even with the action pinned by SHA, the behaviour
      # changes when the cosign it installs by default moves up (v3 made the bundle format the
      # default, and the first release run for v0.3.0 failed at signing).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # If the action is pinned by SHA but GoReleaser itself floats, the build keeps
          # passing silently even when the behaviour changes. Pin the exact version.
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # Attach to the release a signed manifest (packslip.sigstore.json) recording which
      # artifact targets which platform and where the executable sits inside it.
      # mise's packslip: backend reads and verifies this instead of guessing from file names.
      # It is attached only to the release this tag's run produces, not to past releases.
      # Attaching it to a past release takes a separate run that specifies tag: and download:.
      #
      # attest: link only references, by digest, the provenance the previous step registered,
      # and does not attest anything itself (the default, true, would register the same
      # artifacts twice). In exchange, a link for an artifact that was not attested points at
      # nothing, so keep the artifacts glob in line with the previous step's subject-path.
      #
      # The Linux artifacts are described as libc: gnu, because the only way packslip has to
      # drop libc from a Linux artifact is portable, which drops os/arch along with it. The
      # binary is static (CGO_ENABLED=0), so it runs on musl too, but mise does not pick a gnu
      # build on a musl host. On Alpine and the like it does not install via packslip:, but it
      # does via github:.
      - name: Publish packslip
        uses: jdx/packslip@74c75db7d611b36dd5a157999ec16cf823ccf80c # v1.2.0
        with:
          artifacts: dist/*.tar.gz dist/*.zip
          bin: clrnd
          attest: link
