name: release

on:
  push:
    tags:
      - "v*"

# リリースは常に 1 本ずつ流す。group にタグ (github.ref) を含めるとタグごとに別 group に
# なり、v1.2.3 と v1.2.4 を続けて push したときに GoReleaser が同時に走ってしまう
# (同じリポジトリのリリース一覧と dist/ を二重に触ることになる)。固定値にして直列化する。
# 先行のリリースは中断しない: 途中で止めると、成果物の一部だけが公開された状態になる。
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # 正式なリリースは main の履歴上のコミットからだけ作る。検査に通るコミットであっても、
  # main に入っていないブランチのタグから署名・SBOM・provenance 付きのリリースが公開
  # できてしまうのを防ぐ。検査 (verify) より前に置いてあるのは、条件を満たさないタグに
  # 数分のビルドを回さないため。
  guard:
    runs-on: ubuntu-latest
    # 無制限だと、ハングした 1 ジョブが既定の 6 時間まで runner を占有する。
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is on main
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # checkout はタグの ref しか持ってこないので、比較先の main を明示的に取る。
          # 公開リポジトリなので認証情報は要らない (persist-credentials: false のまま)。
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tag $TAG ($SHA) is not an ancestor of main; releases are cut from main only"
            exit 1
          fi
          echo "$TAG ($SHA) is on main"

  # タグ push では通常 CI (ci.yml の push.branches: [main]) が起動しないので、
  # ここで同じ検査を呼ぶ。これが無いと、テストが落ちるコミットや main に入って
  # いないコミットに付けたタグからでも、署名と provenance の付いた正式なリリースが
  # 公開できてしまう。署名は「そのコミットからビルドした」ことしか保証しない。
  # 呼び出し先の checkout はこのワークフローと同じ ref (タグ) を見るので、
  # 検査した SHA と GoReleaser がビルドする SHA は一致する。
  verify:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # リリースの作成と成果物のアップロード
      id-token: write      # cosign の keyless 署名と provenance
      attestations: write  # provenance の登録
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # GoReleaser は GITHUB_TOKEN の環境変数で認証するので、
          # git の認証情報を .git/config に残す必要はない。
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # cosign 本体のバージョンも固定する。アクションを SHA で固定していても、
      # 既定で入る cosign が上がると挙動が変わる (v3 で bundle 形式が既定になり、
      # v0.3.0 の初回リリースが署名で落ちた)。
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install syft
        uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # アクションは SHA で固定しているのに GoReleaser 本体が浮動だと、
          # 挙動が変わってもビルドは黙って通る。正確なバージョンに固定する。
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
