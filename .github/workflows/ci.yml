name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# When the same PR / branch is pushed to in quick succession, stop the old run and run only the
# new one. Only the result for the latest commit is looked at, so an old run just uses a runner.
# release.yml does the opposite: it serializes runs and never cancels them (so artifacts are
# never left half-published).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks themselves live in verify.yml, and release.yml calls the same workflow.
  # Writing them here directly would let the pre-release checks and regular CI drift apart.
  verify:
    uses: ./.github/workflows/verify.yml
