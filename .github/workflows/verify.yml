# CI とリリースの両方から呼ばれる検査。タグからのリリースが通常 CI を通らずに公開
# されるのを防ぐため、検査の定義はここ 1 か所に置き、release.yml からも呼ぶ。
# 直接 push/pull_request では起動しない (呼び出し専用)。
name: verify

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # このワークフローは pull request のコードをビルド・実行する。認証用の
          # extraheader を .git/config に残すと、そのコードから読める。ビルドに
          # git の認証は要らないので置かない (release.yml も同じ設定)。
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # tfstate-lookup pulls in the AWS SDK, the Azure SDK, go-tfe, go-jsonnet and
      # gojq, so most of the dependency tree is indirect. This is the only thing
      # that looks at it, and it covers stdlib advisories too.
      #
      # GOTOOLCHAIN=local で go.mod が指定する Go に対して走らせる。govulncheck-action は
      # 既定で最新の stable を入れてしまい、そちらは常に綺麗なので、リリースが実際に使う
      # ツールチェーン (setup-go が go.mod から入れるもの) の stdlib 脆弱性を見逃す。
      # 実際 go.mod が go1.25.8 のまま到達可能な 15 件を抱えていたのを、v0.3.0 の
      # リリース前確認で初めて見つけた。ここで見えていなければならない。
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        env:
          GOTOOLCHAIN: local

  # リリースが作る組み合わせ (linux/darwin/windows x amd64/arm64) を、タグを打つ前に
  # コンパイルできるか確かめる。通常の Build は runner (linux/amd64) の 1 通りしか見ない
  # ので、Windows 固有のコンパイルエラーや .goreleaser.yaml の壊れがタグ push まで
  # 分からなかった。matrix を手で書くと .goreleaser.yaml とずれるため、GoReleaser 自身に
  # 同じ設定でビルドさせる。--snapshot なのでリリースの作成も署名も provenance も無い。
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser は履歴を見るので shallow clone にしない。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # release.yml と同じバージョンを入れる。ここだけ上げると、PR で通った設定が
      # リリース本番で別の GoReleaser に食わされることになる。
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "2.17.1"
          install-only: true

      - name: Check the GoReleaser config
        run: goreleaser check

      - name: Cross-compile every release target
        run: goreleaser build --snapshot --clean

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # このワークフローは pull request のコードをビルド・実行する。認証用の
          # extraheader を .git/config に残すと、そのコードから読める。ビルドに
          # git の認証は要らないので置かない (release.yml も同じ設定)。
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # アクションを SHA で固定しても、アクションが取ってくる lint 本体は固定されない。
      # 指定が無いと latest が入るので、ローカル (README / CLAUDE.md の go run ...@v2.13.1)
      # と CI が別のバージョンを走らせ、CI の結果が上流のリリースで勝手に変わる。
      # ここを上げるときは README と CLAUDE.md の実行例も一緒に上げること。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
