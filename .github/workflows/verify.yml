# CI とリリースの両方から呼ばれる検査。タグからのリリースが通常 CI を通らずに公開
# されるのを防ぐため、検査の定義はここ 1 か所に置き、release.yml からも呼ぶ。
# 直接 push/pull_request では起動しない (呼び出し専用)。
name: verify

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # 無制限だと、ハングした 1 ジョブが既定の 6 時間まで runner を占有する。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # このワークフローは pull request のコードをビルド・実行する。認証用の
          # extraheader を .git/config に残すと、そのコードから読める。ビルドに
          # git の認証は要らないので置かない (release.yml も同じ設定)。
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # go.mod/go.sum が tidy でない PR を落とす。手で依存を足したときや、
      # 依存を消したのに require が残ったときに気づけるのはここだけ。
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # tfstate-lookup pulls in the AWS SDK, the Azure SDK, go-tfe, go-jsonnet and
      # gojq, so most of the dependency tree is indirect. This is the only thing
      # that looks at it, and it covers stdlib advisories too.
      #
      # GOTOOLCHAIN=local で go.mod が指定する Go に対して走らせる。govulncheck-action は
      # 既定で最新の stable を入れてしまい、そちらは常に綺麗なので、リリースが実際に使う
      # ツールチェーン (setup-go が go.mod から入れるもの) の stdlib 脆弱性を見逃す。
      # 実際 go.mod が go1.25.8 のまま到達可能な 15 件を抱えていたのを、v0.3.0 の
      # リリース前確認で初めて見つけた。ここで見えていなければならない。
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        env:
          GOTOOLCHAIN: local

  # リリースが作る組み合わせ (linux/darwin/windows x amd64/arm64) を、タグを打つ前に
  # コンパイルできるか確かめる。通常の Build は runner (linux/amd64) の 1 通りしか見ない
  # ので、Windows 固有のコンパイルエラーや .goreleaser.yaml の壊れがタグ push まで
  # 分からなかった。matrix を手で書くと .goreleaser.yaml とずれるため、GoReleaser 自身に
  # 同じ設定でビルドさせる。--snapshot なのでリリースの作成も署名も provenance も無い。
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser は履歴を見るので shallow clone にしない。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # release.yml と同じバージョンを入れる。ここだけ上げると、PR で通った設定が
      # リリース本番で別の GoReleaser に食わされることになる。
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "2.17.1"
          install-only: true

      - name: Check the GoReleaser config
        run: goreleaser check

      - name: Cross-compile every release target
        run: goreleaser build --snapshot --clean

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # このワークフローは pull request のコードをビルド・実行する。認証用の
          # extraheader を .git/config に残すと、そのコードから読める。ビルドに
          # git の認証は要らないので置かない (release.yml も同じ設定)。
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # アクションを SHA で固定しても、アクションが取ってくる lint 本体は固定されない。
      # 指定が無いと latest が入るので、ローカル (README / CLAUDE.md の go run ...@v2.13.1)
      # と CI が別のバージョンを走らせ、CI の結果が上流のリリースで勝手に変わる。
      # ここを上げるときは README と CLAUDE.md の実行例も一緒に上げること。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

      # runner にも shellcheck は入っているがバージョンが固定できない。落ちたり通ったり
      # する検査にしないため、版とハッシュを指定して自前で入れる。actionlint も
      # PATH のこれを使って run: ブロックを検査する。
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSLo shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      # E2E は go test に含まれないので、壊れていても Go 側の検査では気づけない。
      # 構文 (bash -n) と静的解析 (shellcheck) はタダで回せる。
      - name: Check the shell scripts
        run: |
          # bash -n は最初のファイルしか見ない (以降は位置引数になる) ので 1 つずつ回す。
          for script in test/e2e/run.sh .github/scripts/*.sh; do
            bash -n "$script"
          done
          shellcheck test/e2e/run.sh .github/scripts/*.sh

      # Dependabot はアクションの SHA と go.mod しか追わない。version 入力や
      # go run ...@vX、自前で入れる ShellCheck の版は手で上げるしかないので、
      # 上げ忘れ (書いてある場所どうしのずれ) をここで落とす。
      - name: Check the pinned tool versions agree
        run: ./.github/scripts/check-tool-pins.sh

      # workflow 自体の式やアクションの入力ミスは、push するまで分からない。
      # actionlint は run: ブロックを PATH の shellcheck にも通す。
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
