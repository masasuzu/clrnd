# Checks called from CI and from the release. To stop a release from a tag being published
# without going through regular CI, the checks are defined only here, and release.yml calls
# them too. This workflow is never triggered by push/pull_request directly (call-only).
name: verify

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # Without a limit, a single hung job holds the runner for the default 6 hours.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow builds and runs code from a pull request. An auth
          # extraheader left in .git/config would be readable by that code. The build
          # needs no git authentication, so do not leave one (release.yml does the same).
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # Fail a PR whose go.mod/go.sum are not tidy. This is the only place that notices a
      # dependency added by hand, or a require left behind after a dependency was removed.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # tfstate-lookup pulls in the AWS SDK, the Azure SDK, go-tfe, go-jsonnet and
      # gojq, so most of the dependency tree is indirect. This is the only thing
      # that looks at it, and it covers stdlib advisories too.
      #
      # GOTOOLCHAIN=local runs it against the Go that go.mod specifies. govulncheck-action
      # installs the latest stable by default, which is always clean, so it misses stdlib
      # vulnerabilities in the toolchain the release actually uses (the one setup-go installs
      # from go.mod). In practice go.mod was still on go1.25.8 and carried 15 reachable
      # vulnerabilities, first found during the pre-release check for v0.3.0. They must be
      # visible here.
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
        env:
          GOTOOLCHAIN: local

  # Check, before a tag is pushed, that the combinations the release builds
  # (linux/darwin/windows x amd64/arm64) compile. The ordinary Build only covers the runner's own
  # target (linux/amd64), so a Windows-only compile error or a broken .goreleaser.yaml went
  # unnoticed until the tag push. A hand-written matrix would drift from .goreleaser.yaml, so
  # GoReleaser itself builds with the same config. With --snapshot there is no release, no
  # signing and no provenance.
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads the history, so do not make a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Install the same version as release.yml. Bumping only this one means the config a PR
      # passed gets fed to a different GoReleaser in the real release.
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "2.17.1"
          install-only: true

      - name: Check the GoReleaser config
        run: goreleaser check

      - name: Cross-compile every release target
        run: goreleaser build --snapshot --clean

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow builds and runs code from a pull request. An auth
          # extraheader left in .git/config would be readable by that code. The build
          # needs no git authentication, so do not leave one (release.yml does the same).
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinning the action by SHA does not pin the linter the action downloads. Without a
      # version it installs latest, so local runs (the go run ...@v2.13.1 in README / CLAUDE.md)
      # and CI run different versions, and CI results change on their own with upstream releases.
      # When bumping this, bump the examples in README and CLAUDE.md along with it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

      # The runner ships a shellcheck too, but its version cannot be pinned. So that the check
      # does not flip between failing and passing, install it ourselves with a pinned version
      # and hash. actionlint also uses this one from PATH to check run: blocks.
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSLo shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      # The E2E test is not part of go test, so the Go-side checks cannot notice it breaking.
      # A syntax check (bash -n) and static analysis (shellcheck) cost nothing to run.
      - name: Check the shell scripts
        run: |
          # bash -n only reads the first file (the rest become positional args), so run it per file.
          for script in test/e2e/run.sh .github/scripts/*.sh; do
            bash -n "$script"
          done
          shellcheck test/e2e/run.sh .github/scripts/*.sh

      # Dependabot only follows action SHAs and go.mod. A version input, a
      # go run ...@vX, or the ShellCheck release we install ourselves can only be bumped by hand,
      # so a missed bump (the places that write it down disagreeing) fails here.
      - name: Check the pinned tool versions agree
        run: ./.github/scripts/check-tool-pins.sh

      # Mistakes in the workflows' own expressions or in action inputs are invisible until pushed.
      # actionlint also runs run: blocks through the shellcheck on PATH.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
