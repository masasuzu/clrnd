# Enable the default linters explicitly, and add the ones for slips this repository actually tends
# to make: checking errors by comparison instead of errors.Is/As (errorlint), and misspellings
# (misspell).
version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - misspell
  settings:
    errcheck:
      # When a write to the terminal fails there is nothing to be done, and silencing every
      # call site with `_ =` buries the errors that really need attention. tabwriter reports
      # failures from Flush, so checking that is enough.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
