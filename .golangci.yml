# On top of the default linters, catch the slips this repository actually tends to make
# (swallowed errors, checking errors by comparison).
version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errorlint
    - misspell
  settings:
    errcheck:
      # When a write to the terminal fails there is nothing to be done, and silencing every
      # call site with `_ =` buries the errors that really need attention. tabwriter reports
      # failures from Flush, so checking that is enough.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
